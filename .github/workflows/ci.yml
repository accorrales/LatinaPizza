name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    defaults:
      run:
        working-directory: latina-pizza-api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none
      - name: Refresh API dependency lock
        run: composer update --with-all-dependencies --no-interaction --no-progress
      - name: Upload refreshed API lock
        uses: actions/upload-artifact@v4
        with:
          name: api-composer-lock
          path: latina-pizza-api/composer.lock
      - run: composer audit --locked --no-interaction
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Apply API formatting
        run: vendor/bin/pint
      - name: Build API formatting patch
        run: git diff --binary -- . > pint.patch
      - name: Upload API formatting patch
        uses: actions/upload-artifact@v4
        with:
          name: api-pint-patch
          path: latina-pizza-api/pint.patch
      - run: vendor/bin/pint --test
      - run: php artisan test

  web:
    name: Web tests and assets
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    defaults:
      run:
        working-directory: latina-pizza-web
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: latina-pizza-web/package-lock.json
      - name: Refresh Web dependency lock
        run: composer update --with-all-dependencies --no-interaction --no-progress
      - name: Upload refreshed Web lock
        uses: actions/upload-artifact@v4
        with:
          name: web-composer-lock
          path: latina-pizza-web/composer.lock
      - run: composer audit --locked --no-interaction
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Apply Web formatting
        run: vendor/bin/pint
      - name: Build Web formatting patch
        run: git diff --binary -- . > pint.patch
      - name: Upload Web formatting patch
        uses: actions/upload-artifact@v4
        with:
          name: web-pint-patch
          path: latina-pizza-web/pint.patch
      - run: vendor/bin/pint --test
      - run: php artisan test
      - run: npm ci
      - run: npm run build
