name: Password recovery on PostgreSQL

on:
  pull_request:
  push:
    branches: ["codex/password-recovery-code"]

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: latina_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: latina_test
      DB_USERNAME: postgres
      DB_PASSWORD: test-only-password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    defaults:
      run:
        working-directory: latina-pizza-api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, curl, mbstring, zip, pdo_pgsql
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: latina-pizza-api
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan test --filter=PasswordResetTest
